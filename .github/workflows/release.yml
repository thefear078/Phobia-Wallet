name: Release

# Build the desktop artifacts on their native runners and attach them to the GitHub Release
# for the pushed tag (e.g. v3.0.1). Windows: installer + portable exe. Linux: self-contained tarball.
# Android: one APK.
on:
  push:
    tags: ["v*"]

# Read-only by default; each job that attaches files to the release asks for write itself.
permissions:
  contents: read

jobs:
  # A published release is never rebuilt. On 2026-10-03 every tag was moved to one commit and this
  # workflow re-ran for each, attaching new files to sixty old release pages. Tags are now immutable
  # (a repository ruleset), and this refuses to build for a release that already carries files.
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse to rebuild a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets \
                   --jq '[.assets[].name | select(startswith("PhobiaWallet-") or startswith("SHA256SUMS-"))] | length' 2>/dev/null || echo 0)"
          if [ "$files" -gt 0 ]; then
            echo "::error::${GITHUB_REF_NAME} already has ${files} release file(s). A published release is never rebuilt - cut a new version."
            exit 1
          fi

  windows:
    name: windows
    needs: guard
    runs-on: windows-latest
    permissions:
      contents: write   # attach its files to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: v
        shell: bash
        run: |
          V="$(tr -d ' \t\r\n' < VERSION)"
          # A beta's files are named "Beta" (betas are not numbered for people), a full release's by its version.
          L="$(echo "$V" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$/Beta/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "display=${L//-/ }" >> "$GITHUB_OUTPUT"

      - name: Stage bundled Tor + Monero
        shell: pwsh
        run: |
          # -RequireSignature: a release is exactly where "we could not check the upstream
          # signature" must not quietly become "checked" (roadmap P0.2).
          ./desktop/scripts/fetch-tor.ps1 -RequireSignature
          ./desktop/scripts/fetch-monero.ps1 -RequireSignature

      - name: Publish (app folder + portable single-file)
        shell: pwsh
        run: |
          $csproj = "desktop/src/Umbrella.Wallet.App/Umbrella.Wallet.App.csproj"
          dotnet publish $csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o dist/app
          dotnet publish $csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/portable
          foreach ($d in "dist/app","dist/portable") { Rename-Item "$d/Umbrella.Wallet.App.exe" "Phobia.exe" -Force }

      # Authenticode, signer "the fear (thefear078)": the program inside the installer and the portable
      # file before packaging, the installer itself after. The certificate lives only in the two
      # secrets and in memory. Without them this repository's release fails; a fork's stays unsigned and says so.
      - name: Sign the executables
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # The thumbprint docs/BUILD_VERIFY.md publishes. Changing the certificate means changing this.
          WINDOWS_CERT_THUMBPRINT: 89C2D871C195D57C14D1911B6C47629DE052C553
        run: ./desktop/scripts/sign-windows.ps1 -Files dist/app/Phobia.exe, dist/portable/Phobia.exe

      - name: Build installer (Inno Setup) + portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = (Get-Content VERSION).Trim()
          $label = "${{ steps.v.outputs.label }}"
          # Shown in Windows as "Phobia Wallet Beta"; the file version stays numeric (4.10.0).
          & $iscc "/DAppVersion=${{ steps.v.outputs.display }}" "/DAppFileLabel=$label" "/DAppNumericVersion=$($ver.Split('-')[0])" "/DSourceDir=$(Resolve-Path dist/app)" "/DDistDir=$(Resolve-Path dist)" desktop/installer/phobia.iss
          # The README links to a single portable EXE, not an archive. Producing a zip here meant the
          # download link on the front page 404'd on every release until somebody uploaded the exe by
          # hand - which the checksum job below would then reject as a stray artifact.
          Copy-Item "dist/portable/Phobia.exe" "dist/PhobiaWallet-$label-win-x64-portable.exe" -Force

      - name: Sign the installer
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # The thumbprint docs/BUILD_VERIFY.md publishes. Changing the certificate means changing this.
          WINDOWS_CERT_THUMBPRINT: 89C2D871C195D57C14D1911B6C47629DE052C553
        run: ./desktop/scripts/sign-windows.ps1 -Files "dist/PhobiaWallet-Setup-${{ steps.v.outputs.label }}.exe"

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: |
            dist/PhobiaWallet-Setup-${{ steps.v.outputs.label }}.exe
            dist/PhobiaWallet-${{ steps.v.outputs.label }}-win-x64-portable.exe

  linux:
    name: linux
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach its files to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version
        id: v
        run: |
          V="$(tr -d ' \t\r\n' < VERSION)"
          # A beta's files are named "Beta" (betas are not numbered for people), a full release's by its version.
          L="$(echo "$V" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$/Beta/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "display=${L//-/ }" >> "$GITHUB_OUTPUT"

      - name: Build self-contained Linux tarball
        env:
          # Tor and Monero are pinned by hash; a release stops rather than ship without them.
          REQUIRE_HELPERS: "1"
        run: |
          chmod +x desktop/scripts/publish-linux.sh
          ( cd desktop && ./scripts/publish-linux.sh )

      - name: Normalise artifact name
        run: |
          V="${{ steps.v.outputs.version }}"
          cp "desktop/dist/linux/phobia-wallet-${V}-linux-x64.tar.gz" "PhobiaWallet-${{ steps.v.outputs.label }}-linux-x64.tar.gz"

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: |
            PhobiaWallet-${{ steps.v.outputs.label }}-linux-x64.tar.gz

  android:
    name: android
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach its files to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The android workload installs into the SDK's own folder, so the SDK goes somewhere this user
      # can write to rather than the runner's root-owned /usr/share/dotnet.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android workload
        run: dotnet workload install android

      - name: Read version
        id: v
        run: |
          V="$(tr -d ' \t\r\n' < VERSION)"
          # A beta's files are named "Beta" (betas are not numbered for people), a full release's by its version.
          L="$(echo "$V" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$/Beta/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "display=${L//-/ }" >> "$GITHUB_OUTPUT"

      # Android installs an update only when it is signed with the same key as the copy already on the
      # phone. That key lives in two repository secrets. In this repository a release without them fails;
      # a fork's release ships an APK signed with a key made for that run alone, and says so.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/phobia.keystore"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"
            ALIAS="${KEY_ALIAS:-phobia}"
          elif [ "$GITHUB_REPOSITORY" = "thefear078/Phobia-Wallet" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set - an official APK must carry the project's key."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set - this APK is signed with a one-off key, and the next one will not install over it."
            PASS="$(openssl rand -hex 24)"
            ALIAS="phobia"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Phobia Wallet, O=the fear"
          fi
          # A throwaway password for a throwaway key, used only when the signing secrets are absent (a fork):
          # masked before the line below writes it to the job environment.
          echo "::add-mask::$PASS"  # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          {
            echo "ANDROID_KEYSTORE=$KS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASS=$PASS"
          } >> "$GITHUB_ENV"

      # Tor and monero-wallet-rpc for both ABIs, pinned and hash-checked; a release APK without them fails.
      - name: Build the APK
        env:
          REQUIRE_HELPERS: "1"
        run: |
          chmod +x desktop/scripts/publish-android.sh desktop/scripts/fetch-android-helpers.sh
          ( cd desktop && ./scripts/publish-android.sh )
          cp "desktop/dist/android/phobia-wallet-${{ steps.v.outputs.version }}-android.apk" "PhobiaWallet-${{ steps.v.outputs.label }}-android.apk"

      # The file people install must carry a v2+ signature from the key above, not the SDK's debug key -
      # and in this repository, from the key whose fingerprint docs/BUILD_VERIFY.md publishes. A secret
      # replaced with another key fails here instead of shipping an APK that cannot update the real one.
      - name: Check the signature
        env:
          PINNED_SHA256: c3800ec634f3c16c844e620bbb922881b634c02b174068d480f89adaa89572d1
        run: |
          APKSIGNER="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "PhobiaWallet-${{ steps.v.outputs.label }}-android.apk" | tee apksigner.txt
          if grep -q "CN=Android Debug" apksigner.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi
          if [ "$GITHUB_REPOSITORY" = "thefear078/Phobia-Wallet" ]; then
            # "Signer #1 certificate SHA-256 digest:" from older apksigner, "V3.0 Signer: certificate SHA-256
            # digest:" from newer - the first signer's certificate either way.
            got="$(grep -m1 -E 'certificate SHA-256 digest:' apksigner.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$got" != "$PINNED_SHA256" ]; then
              echo "::error::APK signer SHA-256 is '$got', not the published $PINNED_SHA256"
              exit 1
            fi
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: |
            PhobiaWallet-${{ steps.v.outputs.label }}-android.apk

  checksums:
    name: checksums
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the manifest to the release
      id-token: write        # OIDC, so the attestation is keyless — no signing key to lose or leak
      attestations: write    # record it against this repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version
        id: v
        run: |
          V="$(tr -d ' \t\r\n' < VERSION)"
          # A beta's files are named "Beta" (betas are not numbered for people), a full release's by its version.
          L="$(echo "$V" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$/Beta/')"
          # The name a copy from Beta 3 or older looks for ("Beta-4"): those updaters put the beta's
          # number in the file name. Empty for a full release, whose name both old and new agree on.
          C="$(echo "$V" | sed -nE 's/^[0-9]+\.[0-9]+\.[0-9]+-beta\.([0-9]+)$/Beta-\1/p')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "compat=$C" >> "$GITHUB_OUTPUT"
          echo "display=${L//-/ }" >> "$GITHUB_OUTPUT"

      # Every build job has finished and attached their artifacts to the release; pull them all
      # back and produce ONE SHA256SUMS.txt so downloaders can verify every file.
      - name: Download all release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "PhobiaWallet-*" --dir assets
          # A re-run finds the numbered copies a previous run attached; they are made again below.
          C="${{ steps.v.outputs.compat }}"
          if [ -n "$C" ]; then rm -f "assets/PhobiaWallet-Setup-${C}.exe" assets/PhobiaWallet-"${C}"-*; fi

      # Fail closed if the release is incomplete: every platform artifact for THIS version must be
      # present and version-stamped before we publish a checksum manifest — a partial release must
      # never yield a SHA256SUMS.txt that silently omits (or misnames) a file.
      - name: Verify the expected artifacts are all present
        run: |
          L="${{ steps.v.outputs.label }}"
          expected=(
            "PhobiaWallet-Setup-${L}.exe"
            "PhobiaWallet-${L}-win-x64-portable.exe"
            "PhobiaWallet-${L}-linux-x64.tar.gz"
            "PhobiaWallet-${L}-android.apk"
          )
          missing=0
          for f in "${expected[@]}"; do
            if [ ! -f "assets/$f" ]; then echo "::error::missing release artifact: $f"; missing=1; fi
          done
          # Reject any stray or wrong-version asset so the manifest is exactly the set.
          for f in assets/PhobiaWallet-*; do
            base="$(basename "$f")"
            keep=0
            for e in "${expected[@]}"; do [ "$base" = "$e" ] && keep=1; done
            if [ "$keep" -eq 0 ]; then echo "::error::unexpected artifact: $base"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "Release artifact set is incomplete or unexpected."; exit 1; }

      # Roadmap R.4. The software bill of materials: every package this commit builds from, with its
      # version and licence, as GitHub's dependency graph reads them (SPDX). Made here, after the set
      # above is checked, so it is covered by the checksum manifest and the attestation like any file.
      - name: Software bill of materials (SPDX)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L="${{ steps.v.outputs.label }}"
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > "assets/PhobiaWallet-${L}-sbom.spdx.json"
          test -s "assets/PhobiaWallet-${L}-sbom.spdx.json"
          jq -e '.spdxVersion and (.packages | length > 0)' "assets/PhobiaWallet-${L}-sbom.spdx.json" > /dev/null

      # Named per release ("SHA256SUMS-Beta-1.txt", "SHA256SUMS-4.10.0.txt"), because that is what the
      # README tells people to run:
      #   sha256sum -c SHA256SUMS-<label>.txt
      # An unversioned manifest also meant a later release's file could sit next to an older one's
      # downloads with no way to tell which build it described.
      - name: Generate and self-verify the checksum manifest
        run: |
          L="${{ steps.v.outputs.label }}"
          ( cd assets && sha256sum PhobiaWallet-* ) > "SHA256SUMS-${L}.txt"
          echo "----- SHA256SUMS-${L}.txt -----"; cat "SHA256SUMS-${L}.txt"
          # Prove every line matches the attached file byte-for-byte before we publish it, and that
          # the manifest is not empty - v4.5.0 shipped one that was.
          [ -s "SHA256SUMS-${L}.txt" ] || { echo "::error::checksum manifest is empty"; exit 1; }
          ( cd assets && sha256sum -c "../SHA256SUMS-${L}.txt" )

      - name: Attach checksums and the SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: |
            SHA256SUMS-${{ steps.v.outputs.label }}.txt
            assets/PhobiaWallet-${{ steps.v.outputs.label }}-sbom.spdx.json

      # Copies from Beta 3 and older look for numbered files ("PhobiaWallet-Setup-Beta-4.exe" and
      # "SHA256SUMS-Beta-4.txt") and would otherwise say "the release has no file to download". The
      # same bytes under those names, with a manifest of their own, keep their one-click update working.
      # Betas only: a full release is named by its version, which every updater agrees on.
      - name: Numbered copies for updaters from Beta 3 and older
        if: steps.v.outputs.compat != ''
        run: |
          L="${{ steps.v.outputs.label }}"; C="${{ steps.v.outputs.compat }}"
          mkdir compat
          cp "assets/PhobiaWallet-Setup-${L}.exe"             "compat/PhobiaWallet-Setup-${C}.exe"
          cp "assets/PhobiaWallet-${L}-win-x64-portable.exe"  "compat/PhobiaWallet-${C}-win-x64-portable.exe"
          cp "assets/PhobiaWallet-${L}-linux-x64.tar.gz"      "compat/PhobiaWallet-${C}-linux-x64.tar.gz"
          cp "assets/PhobiaWallet-${L}-android.apk"           "compat/PhobiaWallet-${C}-android.apk"
          ( cd compat && sha256sum PhobiaWallet-* ) > "SHA256SUMS-${C}.txt"
          ( cd compat && sha256sum -c "../SHA256SUMS-${C}.txt" )
          mv "SHA256SUMS-${C}.txt" compat/

      - name: Attach the numbered copies
        if: steps.v.outputs.compat != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          files: compat/*

      # Roadmap R.3. A checksum proves a download matches the manifest on the release page. It says
      # nothing about who put that page there — and an attacker who can replace the artifacts can
      # replace the manifest beside them. An attestation is the missing half: GitHub signs a
      # statement, keylessly through OIDC, that THESE bytes came out of THIS workflow at THIS commit,
      # and `gh attestation verify` checks it against a transparency log rather than against us.
      #
      # Deliberately after the upload: a release that is complete and attached must not fail because
      # a signing service had a bad minute. A missing attestation is visible and re-runnable; a
      # half-published release is not.
      - name: Attest the release artifacts
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            assets/PhobiaWallet-*
            SHA256SUMS-${{ steps.v.outputs.label }}.txt

      # The attestation also lives on the release as a file, so it can be checked without asking GitHub:
      #   gh attestation verify <file> --repo thefear078/Phobia-Wallet --bundle provenance-<label>.sigstore.json
      - name: Keep the provenance on the release page
        run: cp "${{ steps.attest.outputs.bundle-path }}" "provenance-${{ steps.v.outputs.label }}.sigstore.json"
      - name: Attach the provenance
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          files: provenance-${{ steps.v.outputs.label }}.sigstore.json

      - name: Attest the numbered copies' manifest
        if: steps.v.outputs.compat != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: compat/SHA256SUMS-${{ steps.v.outputs.compat }}.txt
