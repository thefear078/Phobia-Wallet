name: CodeQL

# Static application-security analysis (SAST) for the whole wallet:
#   - csharp                -> the desktop wallet (Avalonia / .NET 8), where fund-critical
#                              signing and key handling live
#   - javascript-typescript -> the web wallet + NestJS backend
# Runs on every push/PR to the default branch and weekly, so newly-published query
# packs catch issues even when the code hasn't changed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 4 * * 1" # Mondays 04:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          # The workflows themselves: script injection from untrusted input, over-broad permissions,
          # unpinned or untrusted steps — the release workflow holds the signing keys.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # C# is not analyzable without a real build; build only, no tests.
      - if: matrix.language == 'csharp'
        run: dotnet build desktop/Umbrella.Wallet.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
