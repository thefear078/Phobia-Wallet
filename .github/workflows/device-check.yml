name: Device check

# The built programs, run where people run them - not just compiled:
#   android - the APK on an Android emulator: it installs, starts without a crash, draws its first
#             screen, and its bundled Tor runs from the native-library folder and bootstraps.
#   linux   - the Linux build on a virtual display: it starts, draws its window, and its bundled Tor
#             carries a request (check.torproject.org says so).
# Screenshots and logs are kept as the run's artifact, so anyone can look at what the device showed.

on:
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/android-device-check.sh"
      - "scripts/linux-desktop-check.sh"
      - ".github/workflows/device-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android workload
        run: dotnet workload install android
      # x86_64, so the emulator runs it at full speed; Tor's own x86_64 Android build is bundled the same
      # way as the ARM ones in the release APK. (Monero publishes no x86_64 Android build.)
      - name: Build the emulator check APK
        env:
          ABIS: x86_64
          ANDROID_RIDS: android-x64
          PHOBIA_SELFTEST: "1"
        run: |
          chmod +x desktop/scripts/publish-android.sh desktop/scripts/fetch-android-helpers.sh
          ( cd desktop && ./scripts/publish-android.sh )
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-device-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-check-android
          path: device-check/
          retention-days: 14

  # The binaries phones get - ARM64 Tor and ARM64 monero-wallet-rpc, the APK built exactly as the
  # release builds it - on an x86_64 Android image that translates ARM code (Android 11 and later carry
  # that translation; GitHub's ARM machines cannot host an emulator). It is the closest a CI run gets to
  # a real phone, and it is the only place Monero runs on Android at all, since Monero publishes no
  # x86_64 Android build. Translation is not a phone, so a failure here is reported, not a blocker.
  android-arm64:
    name: android emulator (ARM64 binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Build the ARM64 self-test APK (Tor and Monero for arm64-v8a, pinned and hash-checked)
        env:
          ABIS: arm64-v8a
          ANDROID_RIDS: android-arm64
          REQUIRE_HELPERS: "1"
          PHOBIA_SELFTEST: "1"
        run: |
          chmod +x desktop/scripts/publish-android.sh desktop/scripts/fetch-android-helpers.sh
          ( cd desktop && ./scripts/publish-android.sh )
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Android 11 (API 30) is the x86_64 image that carries Google's ARM translation; the API 33 image
      # lists only x86_64 and refuses an ARM-only APK (INSTALL_FAILED_NO_MATCHING_ABIS).
      - name: Run it on an emulator that translates ARM
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: device-check-arm64
          MONERO_REQUIRED: "1"
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android-device-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-check-android-arm64
          path: device-check-arm64/
          retention-days: 14

  linux:
    name: linux desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Publish the Linux build (with its pinned Tor and Monero)
        env:
          REQUIRE_HELPERS: "1"
        run: |
          chmod +x desktop/scripts/publish-linux.sh
          ( cd desktop && ./scripts/publish-linux.sh )
      # Xvfb is on the runner image; ImageMagick (screenshots only) usually is not. Whatever is missing is
      # installed with every apt call time-boxed: twice apt hung for the whole step on a busy mirror. If it
      # still fails the run goes on - without screenshots, or failing clearly at "Xvfb not found".
      - name: Virtual display
        timeout-minutes: 8
        continue-on-error: true
        run: |
          need=""
          command -v Xvfb > /dev/null || need="$need xvfb"
          command -v import > /dev/null || need="$need imagemagick"
          [ -n "$need" ] || exit 0
          echo "set man-db/auto-update false" | sudo debconf-communicate > /dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          sudo timeout 240 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get -o DPkg::Lock::Timeout=60 install -y -qq --no-install-recommends $need libice6 libsm6 libfontconfig1 > /dev/null
      - name: Run it
        run: bash scripts/linux-desktop-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-check-linux
          path: device-check/
          retention-days: 14
