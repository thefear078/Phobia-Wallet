name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore desktop/Umbrella.Wallet.sln
      # Exclude the "Live" category — those smoke tests hit real public explorers and would be flaky
      # (and rate-limited) in CI. Run them on demand with: dotnet test --filter Category=Live
      - run: dotnet test desktop/Umbrella.Wallet.sln --no-restore --verbosity minimal --filter "Category!=Live"
      - run: dotnet build desktop/Umbrella.Wallet.sln --no-restore -c Release

  isolation:
    name: network-isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore desktop/Umbrella.Wallet.sln
      # Roadmap P0.8. Its own job so the kill-switch gate is visible as a gate, rather than three
      # tests inside a run of eight hundred. They put a listener on loopback and count connections:
      # with Tor-only armed nothing may reach it, and with it off the same client must — otherwise
      # the first half would pass for the wrong reason. Nothing leaves the runner either way.
      - run: dotnet test desktop/Umbrella.Wallet.sln --no-restore --verbosity minimal --filter "Category=Isolation"

  reproducible:
    name: reproducible-build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the check clones the repo at this commit into a second directory, and a
      # shallow checkout cannot be cloned from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      # Builds this commit twice, from two different absolute paths, and compares the assemblies that
      # actually run. A check nobody runs decays silently, and this one underwrites a promise the
      # release page makes: that verifying a published checksum proves the binary is the source.
      - run: bash scripts/verify-reproducible-build.sh

  supply-chain:
    name: supply-chain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The release job's first step, on every change and on the kind of machine that builds the
      # release: the Tor and Monero it bundles must verify against their projects' own signatures.
      # This only ever ran at release time, so 4.8.0 and 4.8.1 found out there - and shipped Linux-only.
      - name: Stage bundled Tor + Monero (signatures required)
        shell: pwsh
        run: |
          ./desktop/scripts/fetch-tor.ps1 -RequireSignature -Destination "$env:RUNNER_TEMP/tor"
          ./desktop/scripts/fetch-monero.ps1 -RequireSignature -Destination "$env:RUNNER_TEMP/monero"
      # The APK's Tor and Monero (Android builds, pinned in fetch-android-helpers.sh), the same way.
      - name: Android Tor + Monero pins (signatures required)
        shell: pwsh
        run: ./desktop/scripts/verify-android-pins.ps1 -RequireSignature
      # The verified daemon is here anyway, so prove against the real thing what the offline suite can
      # only prove against a copy of its protocol: it writes the random login the wallet reads, the
      # wallet gets in with it, and a caller without it (a web page, another account) gets a 401.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: The Monero service's login, against the real daemon
        shell: pwsh
        run: |
          $env:PHOBIA_MONERO_RPC = Join-Path $env:RUNNER_TEMP "monero/monero-wallet-rpc.exe"
          if (-not (Test-Path $env:PHOBIA_MONERO_RPC)) { Get-ChildItem -Recurse "$env:RUNNER_TEMP/monero" | Select-Object FullName; throw "monero-wallet-rpc.exe was not staged where expected" }
          dotnet test desktop/tests/Umbrella.Wallet.Core.Tests/Umbrella.Wallet.Core.Tests.csproj --verbosity minimal --filter "Category=MoneroDaemon"

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The android workload installs into the SDK's own folder, so the SDK goes somewhere this user
      # can write to rather than the runner's root-owned /usr/share/dotnet.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android workload
        run: dotnet workload install android
      # Signed with the SDK's debug key: this proves the phone app still builds, it is not a release.
      - name: Build the APK
        env:
          REQUIRE_HELPERS: "1"
        run: |
          chmod +x desktop/scripts/publish-android.sh desktop/scripts/fetch-android-helpers.sh
          ( cd desktop && ./scripts/publish-android.sh )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phobia-android-check-build
          path: desktop/dist/android/*.apk
          retention-days: 7

  version:
    name: version-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Release gate (roadmap §2): VERSION must match the csproj, installer, README and CHANGELOG.
      - run: bash scripts/check-version-consistency.sh
      # Roadmap P0.2: the fetch scripts and THIRD_PARTY_NOTICES.md must describe the SAME pinned
      # download. They had drifted — the script pinned a Tor version the mirror no longer carries,
      # so a fresh clone got a 404 and anybody verifying the documented archive by hand was
      # verifying a file that no longer exists.
      - run: bash scripts/check-pinned-binaries.sh
