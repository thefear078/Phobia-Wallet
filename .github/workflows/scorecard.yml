name: Scorecard

# OpenSSF Scorecard: an outside, automated check of how this repository is run — branch protection,
# pinned dependencies, signed releases, token permissions, dangerous workflow patterns. The result is
# published (https://scorecard.dev/viewer/?uri=github.com/thefear078/Phobia-Wallet) and the findings
# appear under Security → Code scanning, so a regression is visible rather than claimed away.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the result, signed, to the public Scorecard API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: results.sarif
