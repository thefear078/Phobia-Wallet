version: 2

# Desktop-only wallet. Security updates are raised immediately regardless of schedule.
updates:
  - package-ecosystem: nuget
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
      - security
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Avalonia 12 is a migration, not an update: its API changes reach every view, and its PRs failed
      # every build (October 2026). It is planned as work of its own; 11.x minor and patch releases
      # still come through the group above.
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: "scope"
