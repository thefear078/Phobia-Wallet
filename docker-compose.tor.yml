# Umbrella Wallet — self-hosted onion stack.
#
#   docker compose -f docker-compose.tor.yml up -d --build
#   docker compose -f docker-compose.tor.yml exec tor cat /var/lib/tor/umbrella/hostname
#
# The printed .onion address serves the full app (web + API via the built-in
# proxy). The frontend auto-enables privacy mode on .onion hosts.
#
# Required: create .env.tor with real secrets (see .env.tor.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: umbra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.tor}
      POSTGRES_DB: umbra_wallet
    volumes:
      - umbra_pg_tor:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://umbra:${POSTGRES_PASSWORD}@postgres:5432/umbra_wallet
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env.tor}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env.tor}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://web:3000}
      # .onion is served over plain HTTP inside Tor — secure cookies would be dropped.
      COOKIE_SECURE: "false"
      # Tor deployment is anonymous-first: Telegram stays off unless explicitly set.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: 3000
      API_ORIGIN: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

  tor:
    build: ./docker/tor
    volumes:
      - ./docker/tor/torrc:/etc/tor/torrc:ro
      - umbra_tor_keys:/var/lib/tor
    depends_on:
      - web
    restart: unless-stopped

volumes:
  umbra_pg_tor:
  umbra_tor_keys:
